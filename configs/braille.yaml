# First real-sensor target: 24 -> 128 -> 27.
name: braille_qat
dataset: braille
T: 100
hidden: 128
n_verify: 100
quant: {bw: 8, f: 4, bu: 16, k: 5, theta: 1.0}   # beta = 1 - 2^-5
train: {epochs: 50, batch_size: 64, lr: 0.002, method: qat, init_gain: 0.5}   # 1.0 explodes then dies (loss stuck at ln 27)
hw: {clk_period_ps: 1000, core_utilization: 40, place_density: 0.6}
